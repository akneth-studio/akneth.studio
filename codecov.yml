# Used in Codecov after updating
coverage:
  round: up
  range: 70..100
  precision: 5
  statuses:
      - type: project
        target: auto
        threshold: 1%
      - type: patch
        target: 90%

codecov:
  branch: main
  bot: "codecov-io"
  strict_yaml_branch: default
  max_report_age: off
  token: secrets.CODECOV_TOKEN

# adding Flags to your `layout` configuration to show up in the PR comment
comment:
  layout:  "diff, flags, files"
  behavior: default
  require_changes: false  
  require_base: yes
  require_head: yes       
  branches: null

comment:
  layout:  "diff, flags, files"
  behavior: default
  require_changes: false  
  require_base: yes
  require_head: yes       
  branches: null
flags:
  - name: components
    paths:
      - src/components/*
  - name: utils
    paths:
      - src/utils/*
  - name: pages
    paths:
      - src/*/page*
  - name: api
    paths:
      - src/api/*
  - name: lib
    paths:
      - src/lib/*
  - name: site
    paths: 
      - src/(site)/*
  - name: admin
    paths:
      - src/(admin)/*

flag_management:
  default_rules:
    carryforward: true
    statuses:
      - type: project
        target: auto
        threshold: 1%
      - type: patch
        target: 90%
  